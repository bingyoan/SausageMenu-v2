workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sausagemenu.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.sausagemenu.app"
        APP_STORE_APP_ID: "6760179953"
        APP_VERSION: "1.1.2"
      node: 20.19.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Build Next.js static export
        script: |
          npm run build

      - name: Add Capacitor iOS platform
        script: |
          npx cap add ios

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Configure iOS sign-in
        script: |
          node scripts/configure-ios-auth.mjs

      - name: Verify iOS permission descriptions
        script: |
          INFO_PLIST="ios/App/App/Info.plist"
          for key in NSCameraUsageDescription NSPhotoLibraryUsageDescription NSLocationWhenInUseUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription; do
            value=$(plutil -extract "$key" raw -o - "$INFO_PLIST")
            if [ -z "$value" ]; then
              echo "Missing required iOS permission description: $key"
              exit 1
            fi
            echo "Verified $key"
          done

      - name: Configure iOS app icon
        script: |
          bash scripts/configure-ios-icon.sh

      - name: Patch Podfile for Xcode 16 compatibility
        script: |
          python3 << 'PYTHON'
          with open('ios/App/Podfile', 'r') as f:
              content = f.read()
          patch = """  installer.pods_project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['SWIFT_STRICT_CONCURRENCY'] = 'minimal'
              config.build_settings['GCC_WARN_INHIBIT_ALL_WARNINGS'] = 'YES'
            end
          end
          """
          content = content.replace(
              'post_install do |installer|',
              'post_install do |installer|\n' + patch
          )
          with open('ios/App/Podfile', 'w') as f:
              f.write(content)
          print("Podfile patched for Xcode 16 compatibility")
          PYTHON

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install

      - name: Embed Google SDK privacy manifests
        script: |
          for manifest in scripts/ios-privacy-manifests/*/PrivacyInfo.xcprivacy; do
            plutil -lint "$manifest"
          done
          ruby scripts/embed-ios-privacy-manifests.rb

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Auto-increment build number
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID")
          if [ -z "$LATEST_BUILD" ]; then
            LATEST_BUILD=0
          fi
          NEW_BUILD=$((LATEST_BUILD + 1))
          if [ -n "$PROJECT_BUILD_NUMBER" ] && [ "$PROJECT_BUILD_NUMBER" -gt "$NEW_BUILD" ]; then
            NEW_BUILD="$PROJECT_BUILD_NUMBER"
          fi
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"
          agvtool new-version -all $NEW_BUILD
          echo "App version set to $APP_VERSION; build number set to $NEW_BUILD (previous was $LATEST_BUILD)"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Verify App Store signature
        script: |
          IPA_PATH=$(find build/ios/ipa -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found"
            exit 1
          fi

          VERIFY_DIR=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_PATH=$(find "$VERIFY_DIR/Payload" -maxdepth 1 -name '*.app' -type d -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No app bundle found in IPA"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          SIGNATURE_INFO=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)
          echo "$SIGNATURE_INFO"
          echo "$SIGNATURE_INFO" | grep -q 'Authority=Apple Distribution'

          PROFILE_PATH="$APP_PATH/embedded.mobileprovision"
          security cms -D -i "$PROFILE_PATH" > "$VERIFY_DIR/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$VERIFY_DIR/profile.plist")
          echo "Provisioning profile: $PROFILE_NAME"
          if GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$VERIFY_DIR/profile.plist" 2>/dev/null); then
            if [ "$GET_TASK_ALLOW" != "false" ]; then
              echo "Invalid App Store profile: get-task-allow is enabled"
              exit 1
            fi
          fi

      - name: Verify SDK privacy manifests in IPA
        script: |
          python3 << 'PYTHON'
          import glob
          import sys
          import zipfile

          ipa_files = glob.glob('build/ios/ipa/*.ipa')
          if len(ipa_files) != 1:
              sys.exit(f'Expected one IPA, found {len(ipa_files)}: {ipa_files}')

          required = [
              'Frameworks/GoogleSignIn.framework/PrivacyInfo.xcprivacy',
              'Frameworks/GTMAppAuth.framework/PrivacyInfo.xcprivacy',
              'Frameworks/GTMSessionFetcher.framework/PrivacyInfo.xcprivacy',
          ]
          with zipfile.ZipFile(ipa_files[0]) as ipa:
              names = ipa.namelist()

          missing = [path for path in required if not any(name.endswith(path) for name in names)]
          if missing:
              sys.exit('Missing SDK privacy manifests: ' + ', '.join(missing))

          print('Verified GoogleSignIn, GTMAppAuth, and GTMSessionFetcher privacy manifests')
          PYTHON

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
